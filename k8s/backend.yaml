apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthsentinel-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthsentinel-backend
  template:
    metadata:
      labels:
        app: healthsentinel-backend
    spec:
      containers:
      - name: backend
        # We will update this tag later with Jenkins!
        image: 563748388981.dkr.ecr.eu-west-3.amazonaws.com/healthsentinel-backend:latest
        # --- AUTOMATED DATABASE MIGRATION ON CONTAINER START ---
        command: ["/bin/sh", "-c"]
        args:
          - |
            npx prisma db push
            npm run dev
        # -------------------------------------------------------
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rds-db-secret
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: healthsentinel-backend-svc
  namespace: default
spec:
  selector:
    app: healthsentinel-backend
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
