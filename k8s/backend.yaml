apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthsentinel-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthsentinel-backend
  template:
    metadata:
      labels:
        app: healthsentinel-backend
    spec:
      containers:
      - name: backend
        image: 856021349334.dkr.ecr.eu-west-3.amazonaws.com/healthsentinel-backend:latest
        # --- FIXED PRODUCTION ENTRYPOINT FOR FASTAPI ---
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rds-db-secret
              key: database-url
        - name: AI_SERVICE_URL
          value: "http://healthsentinel-ai-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: healthsentinel-backend-svc
  namespace: default
spec:
  selector:
    app: healthsentinel-backend
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
